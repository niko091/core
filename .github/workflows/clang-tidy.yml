name: Clang Tidy

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: Clang Tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install clang-tidy
        if: runner.os != 'Windows'
        run: ./tools/metacall-environment.sh debug clangtidy rapidjson

      - name: Install clang-tidy
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\metacall-environment.ps1 clangtidy rapidjson

      - name: Verify clang-tidy tools
        if: runner.os != 'Windows'
        run: |
          clang-tidy --version
          run-clang-tidy --help

      - name: Verify clang-tidy tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang-tidy --version
          run-clang-tidy --help

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: cmake --build build --target clang-tidy
